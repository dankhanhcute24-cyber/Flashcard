<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard - Từ vựng tiếng Trung</title>

  <!-- Google Fonts: Noto Sans SC (tiếng Trung) và Be Vietnam Pro (tiếng Việt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Flashcard tiếng Trung</h1>

  <div class="deck-bar">
    <select id="deckSelect" class="deck-select"></select>
    <button id="newDeckBtn" class="deck-btn">➕ Bộ mới</button>
    <button id="deleteDeckBtn" class="deck-btn deck-btn-danger">🗑️ Xóa bộ</button>
  </div>

  <p id="storageWarning" class="storage-warning" hidden></p>

  <p class="hint">Bấm vào thẻ để lật xem đáp án</p>

  <div class="card" id="card">
    <div class="card-content" id="cardContent">
      <!-- Nội dung thẻ sẽ được JavaScript điền vào đây -->
    </div>
  </div>

  <p class="counter" id="counter"></p>

  <div class="controls">
    <button id="prevBtn">← Trước đó</button>
    <button id="speakBtn">🔊 Đọc lại</button>
    <button id="nextBtn">Tiếp theo →</button>
  </div>

  <div class="upload">
    <label for="excelFile" class="upload-btn">📂 Tải file Excel</label>
    <input type="file" id="excelFile" accept=".xlsx,.xls" hidden>
    <p class="upload-hint">
      Cột theo thứ tự: Chữ Hán | Pinyin | Nghĩa | Câu ví dụ | Pinyin câu ví dụ | Nghĩa câu ví dụ (dòng 1 là tiêu đề).
      Dữ liệu sẽ nhập vào bộ thẻ đang chọn ở trên.
    </p>
  </div>

  <!-- Thư viện SheetJS để đọc file Excel ngay trong trình duyệt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
