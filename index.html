<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard - Từ vựng tiếng Trung</title>

  <!-- Google Fonts: Noto Sans SC (tiếng Trung) và Be Vietnam Pro (tiếng Việt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <p id="storageWarning" class="storage-warning" hidden></p>

  <div class="card" id="card">
    <div class="card-content" id="cardContent">
      <!-- Nội dung thẻ sẽ được JavaScript điền vào đây -->
    </div>

    <!-- Hiện ra khi nhấn giữ vào thẻ -->
    <div class="card-delete-popover" id="cardDeletePopover" hidden>
      <button id="deleteCardBtn" class="delete-popover-btn">🗑 Xóa thẻ này</button>
    </div>
  </div>

  <!-- Thanh công cụ - gói gọn trên 1 hàng ngang, cuộn ngang nếu màn hình hẹp không đủ chỗ -->
  <div class="toolbar">
    <div class="deck-select-wrap" id="deckSelectWrap">
      <select id="deckSelect" class="deck-select"></select>

      <!-- Hiện ra khi nhấn giữ vào bộ thẻ đang chọn -->
      <div class="deck-delete-popover" id="deckDeletePopover" hidden>
        <button id="deleteDeckBtn" class="delete-popover-btn">🗑 Xóa bộ này</button>
      </div>
    </div>
    <button id="newDeckBtn" class="deck-btn">➕ Bộ mới</button>
    <button id="speakBtn" class="deck-btn">🔊 Đọc lại</button>
    <button id="editCardBtn" class="deck-btn">✏️ Sửa</button>
    <button id="addCardBtn" class="deck-btn">➕ Thêm thẻ</button>
    <span class="counter" id="counter"></span>
  </div>

  <div class="upload">
    <label for="excelFile" class="upload-btn">📂 Tải file Excel</label>
    <input type="file" id="excelFile" accept=".xlsx,.xls" hidden>
    <p class="upload-hint">
      Cột theo thứ tự: Chữ Hán | Pinyin | Nghĩa | Câu ví dụ | Pinyin câu ví dụ | Nghĩa câu ví dụ (dòng 1 là tiêu đề).
      Dữ liệu sẽ nhập vào bộ thẻ đang chọn ở trên.
    </p>
  </div>

  <!-- Form thêm/sửa thẻ - ẩn mặc định, JS sẽ hiện ra khi cần -->
  <div class="modal-overlay" id="cardFormOverlay">
    <div class="modal-box">
      <h2 id="cardFormTitle">Thêm thẻ mới</h2>
      <form id="cardForm">
        <label for="formHanzi">Chữ Hán</label>
        <input type="text" id="formHanzi" required>

        <label for="formPinyin">Pinyin</label>
        <input type="text" id="formPinyin" required>

        <label for="formMeaning">Nghĩa tiếng Việt</label>
        <input type="text" id="formMeaning" required>

        <p class="modal-divider">Câu ví dụ (không bắt buộc)</p>

        <label for="formExampleHanzi">Câu ví dụ - Chữ Hán</label>
        <input type="text" id="formExampleHanzi">

        <label for="formExamplePinyin">Pinyin câu ví dụ</label>
        <input type="text" id="formExamplePinyin">

        <label for="formExampleMeaning">Nghĩa câu ví dụ</label>
        <input type="text" id="formExampleMeaning">

        <div class="modal-buttons">
          <button type="button" id="cancelFormBtn" class="deck-btn">Hủy</button>
          <button type="submit" class="deck-btn deck-btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Thư viện SheetJS để đọc file Excel ngay trong trình duyệt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
